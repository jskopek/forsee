{% load static %}
{% load compress %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eye Tracking Keyboard{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <script src="https://unpkg.com/shellviz@0.5.0-beta.3"></script> -->
    <script src="http://localhost:4005/libraries/js/build/browser_client.umd.js"></script>


    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-100 min-h-screen">
    <main class="py-6">
        {% block content %}{% endblock %}
    </main>

    <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.0/dist/cdn.min.js"></script>
    <script>
        document.addEventListener("alpine:init", () => {
            window.Alpine = Alpine;
            console.log("Eye Tracking Keyboard initialized");
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
