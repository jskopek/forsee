<div id="conversation-suggestion-wrapper" x-data="{ showSuggestions: {{ suggestions|length|yesno:'true,false' }}, isSubmitting: false }" x-on:htmx:beforeRequest="isSubmitting = true" x-on:htmx:afterRequest="isSubmitting = false; showSuggestions = true" x-on:message-sent.window="isSubmitting = false">
    <div class="px-6 py-5 border-t border-gray-100 bg-white sticky bottom-0 z-10" x-show="showSuggestions" x-transition>
        <div
            id="conversation-suggestion-panel"
            class="space-y-4"
            data-chat-suggestion-panel
        >
            <div class="space-y-3">
                {% for suggestion in suggestions %}
                    <form
                        method="post"
                        hx-post="{% url 'conversations:message-send' conversation.pk %}"
                        hx-target="#conversation-messages"
                        hx-swap="outerHTML"
                        hx-headers='{"X-Requested-With": "XMLHttpRequest"}'
                        class="group"
                    >
                        {% csrf_token %}
                        <input type="hidden" name="body" value="{{ suggestion }}">
                        <button
                            type="submit"
                            x-bind:disabled="isSubmitting"
                            class="w-full rounded-2xl border border-gray-200 bg-white px-5 py-4 text-left text-base font-medium text-gray-900 shadow-sm transition hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
                        >
                            <span class="block whitespace-normal leading-relaxed">
                                {{ suggestion }}
                            </span>
                        </button>
                    </form>
                {% empty %}
                    <div class="rounded-2xl border border-dashed border-gray-300 bg-white px-5 py-4 text-sm text-gray-500">
                        <div class="flex items-center justify-center space-x-2">
                            <svg class="animate-spin h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>Loading suggestions...</span>
                        </div>
                    </div>
                {% endfor %}
            </div>
            <form
                method="post"
                hx-post="{% url 'conversations:suggestions' conversation.pk %}"
                hx-target="#conversation-suggestion-wrapper"
                hx-swap="outerHTML"
                hx-trigger="submit, message-sent from:window"
                hx-headers='{"X-Requested-With": "XMLHttpRequest"}'
                class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white px-4 py-2 shadow-sm focus-within:border-indigo-300 focus-within:ring-2 focus-within:ring-indigo-100"
            >
                {% csrf_token %}
                <label for="suggestion-hint" class="sr-only">Hint for new suggestions</label>
                <input
                    id="suggestion-hint"
                    name="hint"
                    type="text"
                    value="{{ suggestion_hint }}"
                    placeholder="Want something different? Type a quick hint and press Enter."
                    class="w-full border-0 bg-transparent text-sm text-gray-800 placeholder:text-gray-400 focus:outline-none focus:ring-0"
                    x-bind:disabled="isSubmitting"
                >
                <button
                    type="submit"
                    x-bind:disabled="isSubmitting"
                    class="inline-flex items-center rounded-lg bg-indigo-600 px-3 py-1.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
                    x-bind:class="{ 'opacity-50 cursor-not-allowed': isSubmitting }"
                >
                    Refresh
                </button>
            </form>
        </div>
    </div>

    <!-- Generate Suggestions Button -->
    {% if not suggestions %}
    <button
        type="button"
        x-show="!showSuggestions"
        x-transition
        hx-post="{% url 'conversations:suggestions' conversation.pk %}"
        hx-target="#conversation-suggestion-wrapper"
        hx-swap="outerHTML"
        hx-trigger="click"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        class="fixed bottom-6 right-6 inline-flex items-center gap-2 rounded-full bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition z-50"
        aria-label="Generate suggestions"
    >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
        </svg>
        Generate Suggestions
    </button>
    {% else %}
    <button
        type="button"
        x-show="!showSuggestions"
        x-transition
        class="fixed bottom-6 right-6 inline-flex items-center gap-2 rounded-full bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition z-50"
        aria-label="Generate suggestions"
    >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
        </svg>
        Generate Suggestions
    </button>
    {% endif %}
</div>
