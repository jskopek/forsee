{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Edit User{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-semibold text-gray-900 mb-6">Edit {{ object.email }}</h1>

    <div class="bg-white shadow rounded-lg p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="flex items-center justify-end gap-3">
                <a href="{% url 'administrator:dashboard' %}" class="inline-flex items-center justify-center rounded-md border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit" class="inline-flex items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">
                    Save changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
