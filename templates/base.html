{% load static %}
{% load compress %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eye Tracking Keyboard{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="text-xl font-bold text-gray-800">Eye Tracking Keyboard</a>
                    </div>
                    <div class="ml-6 flex items-center space-x-4">
                        <a href="{% url 'home' %}" class="text-gray-700 hover:text-gray-900">Contacts</a>
                        <a href="{% url 'conversations:list' %}" class="text-gray-700 hover:text-gray-900">Conversations</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4 text-sm text-gray-500">
                    Single-user preview
                </div>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% compress js %}
    <script src="{% static 'dist/bundle.js' %}"></script>
    {% endcompress %}

    {% block extra_js %}{% endblock %}
</body>
</html>
