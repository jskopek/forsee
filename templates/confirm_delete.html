{% extends 'base.html' %}

{% block title %}Delete {{ object }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-semibold text-gray-900 mb-6">Delete {{ object }}</h1>
    <div class="bg-white shadow rounded-lg p-6 space-y-4">
        <p class="text-gray-700">
            Are you sure you want to delete <strong>{{ object }}</strong>?
        </p>
        <form method="post" class="flex items-center justify-end space-x-3">
            {% csrf_token %}
            {% if cancel_url %}
            <a href="{{ cancel_url }}" class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">
                Cancel
            </a>
            {% endif %}
            <button type="submit" class="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700">
                Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
