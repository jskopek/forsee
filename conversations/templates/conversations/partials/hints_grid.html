<div class="hints-grid">
    {% if hints %}
        <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2">
            {% for hint in hints %}
                <button
                    type="button"
                    x-data="{ selected: false }"
                    x-on:click="$dispatch('hint-clicked', {word: '{{ hint.word|escapejs }}', emoji: '{{ hint.emoji|escapejs }}'})"
                    x-on:hint-selected.window="if ($event.detail.word === '{{ hint.word|escapejs }}') selected = true"
                    x-on:hint-deselected.window="if ($event.detail.word === '{{ hint.word|escapejs }}') selected = false"
                    x-bind:class="selected ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-gray-900 border-gray-300 hover:border-indigo-300 hover:bg-indigo-50'"
                    class="hint-button rounded-lg border px-3 py-2 text-sm font-medium transition focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-1 flex flex-col items-center gap-1"
                    data-hint-word="{{ hint.word }}"
                    data-hint-emoji="{{ hint.emoji }}"
                >
                    <span class="emoji text-lg">{{ hint.emoji }}</span>
                    <span class="word text-xs">{{ hint.word }}</span>
                </button>
            {% endfor %}
        </div>
    {% else %}
        <div class="rounded-2xl border border-dashed border-gray-300 bg-white px-5 py-4 text-sm text-gray-500">
            <div class="flex items-center justify-center space-x-2">
                <svg class="animate-spin h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Loading hints...</span>
            </div>
        </div>
    {% endif %}
</div>
