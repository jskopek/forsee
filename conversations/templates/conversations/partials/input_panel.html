<div 
    id="conversation-input-wrapper" 
    data-conversation-id="{{ conversation.pk }}"
    x-data="{ 
        messageText: '', 
        isSubmitting: false,
        showSuggestions: false,
        showHints: false,
        selectedHints: [],
        hintsLoading: false,
        suggestionsLoading: false,
        hints: [],
        suggestions: [],
        conversationId: $el.dataset.conversationId,
        getHintsApiUrl() { return '/api/conversations/' + this.conversationId + '/hints'; },
        getSuggestionsApiUrl() { return '/api/conversations/' + this.conversationId + '/suggestions'; },
        getMessagesApiUrl() { return '/api/conversations/' + this.conversationId + '/messages'; },
        async sendMessage(messageBody, sender = null) {
            if (!messageBody.trim()) return false;
            
            this.isSubmitting = true;
            try {
                const requestBody = { body: messageBody.trim() };
                // Only include sender if explicitly provided, otherwise let API alternate
                if (sender) {
                    requestBody.sender = sender;
                }
                
                const response = await fetch(this.getMessagesApiUrl(), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    throw new Error('Failed to send message');
                }
                
                // Dispatch event to trigger message list refresh
                window.dispatchEvent(new CustomEvent('message-sent'));
                this.handleMessageSent();
                return true;
            } catch (error) {
                console.error('Error sending message:', error);
                this.isSubmitting = false;
                return false;
            }
        },
        toggleHint(word, emoji) {
            const index = this.selectedHints.indexOf(word);
            const currentText = this.messageText.trim();
            const words = currentText ? currentText.split(/\s+/) : [];
            
            if (index === -1) {
                this.selectedHints.push(word);
                words.push(word);
                this.messageText = words.join(' ');
                window.dispatchEvent(new CustomEvent('hint-selected', { detail: { word, emoji } }));
                this.refreshSuggestions();
            } else {
                this.selectedHints.splice(index, 1);
                const filteredWords = words.filter(w => w !== word);
                this.messageText = filteredWords.join(' ');
                window.dispatchEvent(new CustomEvent('hint-deselected', { detail: { word, emoji } }));
            }
        },
        refreshHints() {
            if (!this.showHints) return;
            this.hintsLoading = true;
            fetch(this.getHintsApiUrl(), {
                method: 'GET',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                credentials: 'same-origin'
            })
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch hints');
                return response.json();
            })
            .then(data => {
                this.hints = data.hints || [];
                this.hintsLoading = false;
                this.$nextTick(() => {
                    const contentDiv = document.getElementById('conversation-hints-content');
                    if (contentDiv) {
                        Alpine.initTree(contentDiv);
                        this.selectedHints.forEach(word => {
                            window.dispatchEvent(new CustomEvent('hint-selected', { detail: { word } }));
                        });
                    }
                });
            })
            .catch(error => {
                console.error('Error fetching hints:', error);
                this.hints = [];
                this.hintsLoading = false;
            });
        },
        refreshSuggestions() {
            this.suggestionsLoading = true;
            const hintText = this.messageText.trim() || null;
            fetch(this.getSuggestionsApiUrl(), {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'Content-Type': 'application/json',
                },
                credentials: 'same-origin',
                body: JSON.stringify({ hint: hintText })
            })
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch suggestions');
                return response.json();
            })
            .then(data => {
                this.suggestions = data.suggestions || [];
                this.showSuggestions = this.suggestions.length > 0;
                this.suggestionsLoading = false;
                this.$nextTick(() => {
                    const panelDiv = document.getElementById('conversation-suggestion-panel');
                    if (panelDiv && typeof htmx !== 'undefined') {
                        htmx.process(panelDiv);
                    }
                });
            })
            .catch(error => {
                console.error('Error fetching suggestions:', error);
                this.suggestions = [];
                this.showSuggestions = false;
                this.suggestionsLoading = false;
            });
        },
        toggleHintsMode() {
            this.showHints = !this.showHints;
            if (this.showHints) {
                this.refreshHints();
            } else {
                this.selectedHints = [];
            }
        },
        handleMessageSent() {
            this.isSubmitting = false;
            this.messageText = '';
            this.showSuggestions = false;
            this.selectedHints = [];
            if (this.showHints) {
                this.refreshHints();
            }
        }
    }"
    x-on:message-sent.window="handleMessageSent()"
    x-on:hint-clicked.window="toggleHint($event.detail.word, $event.detail.emoji)"
    class="px-6 py-4 border-t border-gray-100 bg-white sticky bottom-0 z-10"
>
    <!-- Hints Panel -->
    <div 
        id="conversation-hints-panel"
        x-show="showHints"
        x-transition
        class="mb-4 p-4 bg-gray-50 rounded-xl border border-gray-200"
    >
        <div id="conversation-hints-content">
            <template x-if="hintsLoading">
                <div class="rounded-2xl border border-dashed border-gray-300 bg-white px-5 py-4 text-sm text-gray-500">
                    <div class="flex items-center justify-center space-x-2">
                        <svg class="animate-spin h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Loading hints...</span>
                    </div>
                </div>
            </template>
            <template x-if="!hintsLoading && hints.length === 0">
                <div class="rounded-2xl border border-dashed border-gray-300 bg-white px-5 py-4 text-sm text-gray-500">
                    <div class="flex items-center justify-center space-x-2">
                        <span>Click "Hints" to load word hints</span>
                    </div>
                </div>
            </template>
            <template x-if="!hintsLoading && hints.length > 0">
                <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2">
                    <template x-for="hint in hints" :key="hint.word">
                        <button
                            type="button"
                            x-data="{ selected: false }"
                            x-on:click="$dispatch('hint-clicked', {word: hint.word, emoji: hint.emoji})"
                            x-on:hint-selected.window="if ($event.detail.word === hint.word) selected = true"
                            x-on:hint-deselected.window="if ($event.detail.word === hint.word) selected = false"
                            x-bind:class="selected ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-gray-900 border-gray-300 hover:border-indigo-300 hover:bg-indigo-50'"
                            class="hint-button rounded-lg border px-3 py-2 text-sm font-medium transition focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-1 flex flex-col items-center gap-1"
                        >
                            <span class="emoji text-lg" x-text="hint.emoji"></span>
                            <span class="word text-xs" x-text="hint.word"></span>
                        </button>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <!-- Suggestions Panel -->
    <div 
        id="conversation-suggestion-panel"
        x-show="showSuggestions"
        x-transition
        class="mb-4 space-y-3"
        data-chat-suggestion-panel
    >
        <template x-if="suggestionsLoading">
            <div class="rounded-2xl border border-dashed border-gray-300 bg-white px-5 py-4 text-sm text-gray-500">
                <div class="flex items-center justify-center space-x-2">
                    <svg class="animate-spin h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Loading suggestions...</span>
                </div>
            </div>
        </template>
        <template x-if="!suggestionsLoading && suggestions.length > 0">
            <template x-for="suggestion in suggestions" :key="suggestion">
                <button
                    type="button"
                    x-on:click="sendMessage(suggestion)"
                    x-bind:disabled="isSubmitting"
                    class="w-full rounded-2xl border border-gray-200 bg-white px-5 py-4 text-left text-base font-medium text-gray-900 shadow-sm transition hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <span class="block whitespace-normal leading-relaxed" x-text="suggestion"></span>
                </button>
            </template>
        </template>
    </div>

    <!-- Main Input Form -->
    <div class="flex items-center gap-3">
        <div class="flex items-center gap-3 flex-1">
            <div class="flex-1 relative">
                <label for="message-input" class="sr-only">Type your message</label>
                <input
                    id="message-input"
                    type="text"
                    x-model="messageText"
                    placeholder="Type a message..."
                    class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-base text-gray-900 placeholder:text-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
                    x-bind:disabled="isSubmitting"
                    x-on:keydown.enter.prevent="if (messageText.trim() && !isSubmitting) sendMessage(messageText)"
                    autocomplete="off"
                >
            </div>
            <button
                type="button"
                x-on:click="sendMessage(messageText)"
                x-bind:disabled="isSubmitting || !messageText.trim()"
                class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <span x-show="!isSubmitting">Send</span>
                <svg x-show="isSubmitting" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>
        <button
            type="button"
            x-on:click="toggleHintsMode()"
            x-bind:class="showHints 
                ? 'bg-indigo-600 text-white border-indigo-700 hover:bg-indigo-700' 
                : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-50'"
            class="inline-flex items-center justify-center rounded-xl border px-5 py-3 text-sm font-semibold shadow-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
        >
            <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
            </svg>
            Hints
        </button>
        <button
            type="button"
            x-on:click="refreshSuggestions()"
            x-bind:disabled="isSubmitting || suggestionsLoading"
            class="inline-flex items-center justify-center rounded-xl border border-gray-300 bg-white px-5 py-3 text-sm font-semibold text-gray-700 shadow-sm transition hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
            <svg x-show="!suggestionsLoading" class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
            </svg>
            <svg x-show="suggestionsLoading" class="animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Suggestions
        </button>
    </div>
</div>
