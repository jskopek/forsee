<div 
    id="conversation-input-wrapper" 
    x-data="{ 
        messageText: '', 
        isSubmitting: false,
        showSuggestions: {{ suggestions|length|yesno:'true,false' }}
    }"
    x-on:htmx:beforeRequest="isSubmitting = true"
    x-on:htmx:afterRequest="isSubmitting = false; messageText = ''; showSuggestions = true"
    x-on:htmx:after-swap.window="if ($event.detail.target && $event.detail.target.id === 'conversation-suggestion-panel') { showSuggestions = true; }"
    x-on:message-sent.window="isSubmitting = false; messageText = ''; showSuggestions = false"
    class="px-6 py-4 border-t border-gray-100 bg-white sticky bottom-0 z-10"
>
    <!-- Suggestions Panel (shown when suggestions are available) -->
    <div 
        id="conversation-suggestion-panel"
        x-show="showSuggestions"
        x-transition
        class="mb-4 space-y-3"
        data-chat-suggestion-panel
    >
        {% include "conversations/partials/suggestion_list.html" with conversation=conversation suggestions=suggestions %}
    </div>

    <!-- Main Input Form -->
    <div class="flex items-center gap-3">
        <form
            method="post"
            hx-post="{% url 'conversations:message-send' conversation.pk %}"
            hx-target="#conversation-messages"
            hx-swap="outerHTML"
            hx-headers='{"X-Requested-With": "XMLHttpRequest"}'
            x-on:submit="if (!messageText.trim()) { $event.preventDefault(); }"
            class="flex items-center gap-3 flex-1"
        >
            {% csrf_token %}
            <div class="flex-1 relative">
                <label for="message-input" class="sr-only">Type your message</label>
                <input
                    id="message-input"
                    name="body"
                    type="text"
                    x-model="messageText"
                    placeholder="Type a message..."
                    class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-base text-gray-900 placeholder:text-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
                    x-bind:disabled="isSubmitting"
                    autocomplete="off"
                >
            </div>
            <button
                type="submit"
                x-bind:disabled="isSubmitting || !messageText.trim()"
                class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <span x-show="!isSubmitting">Send</span>
                <svg x-show="isSubmitting" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
        <form
            method="post"
            hx-post="{% url 'conversations:suggestions' conversation.pk %}"
            hx-target="#conversation-suggestion-panel"
            hx-swap="innerHTML"
            hx-headers='{"X-Requested-With": "XMLHttpRequest"}'
            x-on:submit="showSuggestions = true"
            class="inline-flex"
        >
            {% csrf_token %}
            <input type="hidden" name="hint" x-model="messageText">
            <button
                type="submit"
                x-bind:disabled="isSubmitting"
                class="inline-flex items-center justify-center rounded-xl border border-gray-300 bg-white px-5 py-3 text-sm font-semibold text-gray-700 shadow-sm transition hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                </svg>
                Suggestions
            </button>
        </form>
    </div>
</div>
