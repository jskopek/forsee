<div
    id="conversation-suggestion-panel"
    class="space-y-4"
    data-chat-suggestion-panel
>
    <div class="space-y-3">
        {% for suggestion in suggestions %}
            <form
                method="post"
                hx-post="{% url 'conversations:message-send' conversation.pk %}"
                hx-target="#conversation-messages"
                hx-swap="outerHTML"
                hx-headers='{"X-Requested-With": "XMLHttpRequest"}'
                class="group"
            >
                {% csrf_token %}
                <input type="hidden" name="body" value="{{ suggestion }}">
                <button
                    type="submit"
                    x-bind:disabled="isSubmitting"
                    class="w-full rounded-2xl border border-gray-200 bg-white px-5 py-4 text-left text-base font-medium text-gray-900 shadow-sm transition hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
                >
                    <span class="block whitespace-normal leading-relaxed">
                        {{ suggestion }}
                    </span>
                </button>
            </form>
        {% empty %}
            <div class="rounded-2xl border border-dashed border-gray-300 bg-white px-5 py-4 text-sm text-gray-500">
                We're getting suggestions ready. Try entering a quick hint below to jump start ideas.
            </div>
        {% endfor %}
    </div>
    <form
        method="post"
        hx-post="{% url 'conversations:suggestions' conversation.pk %}"
        hx-target="#conversation-suggestion-panel"
        hx-swap="outerHTML"
        hx-trigger="submit, message-sent from:window"
        hx-headers='{"X-Requested-With": "XMLHttpRequest"}'
        class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white px-4 py-2 shadow-sm focus-within:border-indigo-300 focus-within:ring-2 focus-within:ring-indigo-100"
    >
        {% csrf_token %}
        <label for="suggestion-hint" class="sr-only">Hint for new suggestions</label>
        <input
            id="suggestion-hint"
            name="hint"
            type="text"
            value="{{ suggestion_hint }}"
            placeholder="Want something different? Type a quick hint and press Enter."
            class="w-full border-0 bg-transparent text-sm text-gray-800 placeholder:text-gray-400 focus:outline-none focus:ring-0"
            x-bind:disabled="isSubmitting"
        >
        <button
            type="submit"
            x-bind:disabled="isSubmitting"
            class="inline-flex items-center rounded-lg bg-indigo-600 px-3 py-1.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
            x-bind:class="{ 'opacity-50 cursor-not-allowed': isSubmitting }"
        >
            Refresh
        </button>
    </form>
    <template x-if="error">
        <p class="mt-2 text-sm text-red-600" x-text="error"></p>
    </template>
</div>
