server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Stable download links for the website, emails and posters. They always
  # point at the newest published release.
  location = /download/mac {
    return 302 https://github.com/jskopek/forsee/releases/latest/download/Forsee.dmg;
  }
  location = /download/windows {
    return 302 https://github.com/jskopek/forsee/releases/latest/download/Forsee-Setup.exe;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
