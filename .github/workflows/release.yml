# Builds the macOS and Windows apps on every push to main (and on pull
# requests that change packaging), and signs them when the signing secrets
# are set up. A GitHub Release is published only when all of these hold:
#   - this is main,
#   - the version in apps/desktop/package.json is new (no tag v<version>),
#   - CHANGELOG.md has an entry for it (it becomes the release notes),
#   - both apps are signed.
# Installed copies update themselves from that release. Other builds are
# kept as workflow artifacts, for testing only.
#
# Set-up and secret names: docs/RELEASING.md.
name: Release

on:
  push:
    branches: [main]
  # Pull requests that touch packaging build too (never publish), so the
  # installers can be tried before merging.
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-new: ${{ steps.version.outputs.is-new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "is-new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; building only."
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new."
          fi
      # A new version is released only with its CHANGELOG.md entry, which
      # becomes the release notes. Without one this fails before building.
      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.is-new == 'true'
        run: node apps/desktop/scripts/release-notes.mjs > release-notes.md
      - if: steps.version.outputs.is-new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  mac:
    needs: version
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forsee/web build
      - run: pnpm --filter @forsee/desktop build

      - id: signing
        name: Prepare signing
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Sign only what can be released: builds of main.
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/apple-api-key.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not main, or macOS signing secrets not set; building an unsigned app."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed and notarised app
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec electron-builder --mac --publish never

      - name: Build unsigned app
        if: steps.signing.outputs.signed != 'true'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac --publish never -c.mac.notarize=false

      - uses: actions/upload-artifact@v4
        with:
          name: forsee-mac
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml

  windows:
    needs: version
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        shell: bash
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'forsee' }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forsee/web build
      - run: pnpm --filter @forsee/desktop build

      - id: signing
        name: Check signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          # Sign only what can be released: builds of main.
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ] && [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not main, or SignPath not set up; building an unsigned installer."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # 1. The app itself (Forsee.exe and its files), unsigned.
      - name: Package app
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --dir --publish never

      # 2. Sign the app's files with SignPath (artifact configuration "app").
      - id: upload-app
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-win-app
          path: apps/desktop/release/win-unpacked
          if-no-files-found: error
      - if: steps.signing.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/release/win-signed

      # 3. Wrap the (signed) app in the installer.
      - name: Build installer
        working-directory: apps/desktop
        run: |
          app=release/win-unpacked
          if [ -d release/win-signed ]; then app=release/win-signed; fi
          pnpm exec electron-builder --win nsis --prepackaged "$app" --publish never

      # 4. Sign the installer (artifact configuration "installer"), then make
      #    the updater's metadata match the signed file.
      - id: upload-installer
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-win-installer
          path: apps/desktop/release/Forsee-Setup.exe
          if-no-files-found: error
      - if: steps.signing.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/release/installer-signed
      - if: steps.signing.outputs.signed == 'true'
        working-directory: apps/desktop
        run: |
          cp release/installer-signed/Forsee-Setup.exe release/Forsee-Setup.exe
          node scripts/refresh-update-info.mjs release/Forsee-Setup.exe release/latest.yml

      - uses: actions/upload-artifact@v4
        with:
          name: forsee-windows
          if-no-files-found: error
          path: |
            apps/desktop/release/Forsee-Setup.exe
            apps/desktop/release/Forsee-Setup.exe.blockmap
            apps/desktop/release/latest.yml

  publish:
    needs: [version, mac, windows]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.version.outputs.is-new == 'true' &&
      needs.mac.outputs.signed == 'true' &&
      needs.windows.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: forsee-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Forsee $VERSION" \
            --notes-file release-notes.md
