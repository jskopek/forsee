name: Phone Gaze

on:
  push:
    paths:
      - 'sidecars/phone-gaze/**'
      - 'tools/eye-capture/ios/**'
      - '.github/workflows/phone-gaze.yml'
  workflow_dispatch:

concurrency:
  group: phone-gaze-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sidecars/phone-gaze/engine

jobs:
  engine-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/phone-gaze/engine/requirements.txt
      - name: System libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Download models
        run: python -m phonegaze.download
      - name: Test
        run: python -m pytest -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright for the simulator end-to-end tests
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser UI end-to-end against the simulator
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PG_PYTHON: python
        run: node tests/ui/ui_e2e.cjs
      - name: Tuning page, presets and fallback pointer end-to-end against the simulator
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PG_PYTHON: python
        run: node tests/ui/tuning_e2e.cjs
      - name: Accuracy end-to-end against the simulator (ARKit and camera modes)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PG_PYTHON: python
          PG_RESULTS: ${{ runner.temp }}/accuracy.json
        run: node tests/ui/accuracy_e2e.cjs arkit camera
      - name: Keep the accuracy numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-gaze-accuracy
          path: ${{ runner.temp }}/accuracy.json
          if-no-files-found: ignore

  engine-macos:
    name: Engine on macOS (run script, Mac outputs, simulator run)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with the owner's run script
        working-directory: sidecars/phone-gaze
        run: ./run.sh --install-only
      - name: Mac outputs import, and the screen size comes from macOS
        run: |
          .venv/bin/python - <<'PY'
          import importlib.metadata as m
          from phonegaze.outputs import cursor, hotkeys
          from phonegaze.outputs._quartz import quartz
          from phonegaze.outputs.screen import get_screen_info
          print("pynput", m.version("pynput"))
          print("cursor", cursor.__name__, "hotkeys", hotkeys.__name__, "quartz", quartz())
          s = get_screen_info()
          print("screen", s.to_dict())
          assert s.source == "macos", s
          assert s.width > 0 and s.height > 0
          PY
      - name: Start the engine against the simulator for a few seconds
        working-directory: sidecars/phone-gaze
        run: |
          ./run.sh --sim arkit --no-browser --no-cursor --no-hotkeys --port 8765 > "$RUNNER_TEMP/engine.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 90); do
            sleep 1
            if curl -fsS http://127.0.0.1:8765/api/state -o "$RUNNER_TEMP/state.json"; then
              if python3 -c "import json,sys; s=json.load(open(sys.argv[1])); sys.exit(0 if s['phone']['connected'] and (s['pipeline'].get('fps') or 0) > 1 else 1)" "$RUNNER_TEMP/state.json"; then
                ok=1
                break
              fi
            fi
          done
          python3 -c "import json,sys; s=json.load(open(sys.argv[1])); print('fps', s['pipeline'].get('fps'), 'screen', s['screen'])" "$RUNNER_TEMP/state.json" || true
          curl -fsS http://127.0.0.1:8765/ -o /dev/null
          kill $pid || true
          tail -n 30 "$RUNNER_TEMP/engine.log"
          test "$ok" = 1
      - name: Test
        run: .venv/bin/python -m pytest -q -rs

  ios-build:
    name: iOS app compiles
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/eye-capture/ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project EyeCapture.xcodeproj \
            -target EyeCapture \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  ios-simulator:
    name: iOS app in the Simulator talks to the engine (test pattern)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Xcode and simulators
        working-directory: tools/eye-capture/ios
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Build the app for the Simulator
        working-directory: tools/eye-capture/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project EyeCapture.xcodeproj \
            -target EyeCapture \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 40
          test -d "$RUNNER_TEMP/build/Debug-iphonesimulator/EyeCapture.app"
      - name: Boot a Simulator, install and launch the app
        working-directory: tools/eye-capture/ios
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return tuple(int(n) for n in re.findall(r"iOS-(\d+)-(\d+)", runtime)[0]) if "iOS" in runtime else (0, 0)
          best = None
          for runtime, items in devices.items():
              for d in items:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      key = (version(runtime), d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"], runtime)
          print(best[1]); print(best, file=sys.stderr)
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/build/Debug-iphonesimulator/EyeCapture.app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/build/Debug-iphonesimulator/EyeCapture.app/Info.plist")
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
          xcrun simctl privacy "$udid" grant camera "$bundle" || true
          xcrun simctl launch "$udid" "$bundle"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/status -o "$RUNNER_TEMP/status.json"; then break; fi
            sleep 1
          done
          python3 -m json.tool "$RUNNER_TEMP/status.json" | head -n 80
      - name: Install the engine
        working-directory: sidecars/phone-gaze
        run: ./run.sh --install-only
      - name: The engine's phone client against the app
        working-directory: sidecars/phone-gaze/engine
        env:
          PHONEGAZE_APP_URL: http://127.0.0.1:8080
        # perl's alarm: macOS has no timeout(1); a hang fails in 10 minutes, not at the job limit.
        run: perl -e 'alarm shift; exec @ARGV' 600 .venv/bin/python -m pytest -v -s -rs tests/realapp_phone_app.py
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sim"
          curl -fsS http://127.0.0.1:8080/api/status -o "$RUNNER_TEMP/sim/status.json" || echo "the app does not answer"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/sim/screen.png" || true
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "EyeCapture"' > "$RUNNER_TEMP/sim/app.log" 2>&1 || true
          tail -n 80 "$RUNNER_TEMP/sim/app.log" || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i eyecapture && \
            cp ~/Library/Logs/DiagnosticReports/*EyeCapture* "$RUNNER_TEMP/sim/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-diagnostics
          path: ${{ runner.temp }}/sim
          if-no-files-found: ignore
