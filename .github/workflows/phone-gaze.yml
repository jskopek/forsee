name: Phone Gaze

on:
  push:
    paths:
      - 'sidecars/phone-gaze/**'
      - 'tools/eye-capture/ios/**'
      - '.github/workflows/phone-gaze.yml'
  workflow_dispatch:

concurrency:
  group: phone-gaze-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sidecars/phone-gaze/engine

jobs:
  engine-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/phone-gaze/engine/requirements.txt
      - name: System libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Download models
        run: python -m phonegaze.download
      - name: Test
        run: python -m pytest -q -rs

  engine-macos:
    name: Engine tests (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/phone-gaze/engine/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Check pynput is installed (macOS only dependency)
        run: python -c "import importlib.metadata as m; print('pynput', m.version('pynput'))"
      - name: Download models
        run: python -m phonegaze.download
      - name: Test
        run: python -m pytest -q -rs

  ios-build:
    name: iOS app compiles
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/eye-capture/ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project EyeCapture.xcodeproj \
            -target EyeCapture \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
